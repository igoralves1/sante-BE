services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sante}
      POSTGRES_DB: ${POSTGRES_DB:-sante}
      TZ: America/Maceio
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sante}:${POSTGRES_PASSWORD:-sante}@db:5432/${POSTGRES_DB:-sante}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://igoralves1.github.io}
      SEED_ON_START: ${SEED_ON_START:-true}
      RELOAD: ${RELOAD:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    # desenvolvimento: o código local entra no container e o uvicorn recarrega a cada mudança
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./seed:/app/seed
      - ./pyproject.toml:/app/pyproject.toml

volumes:
  pgdata:
